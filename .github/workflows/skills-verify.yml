name: skills-verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Force bash on both Linux and Windows so Makefile recipes use POSIX shell
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install iverilog (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog make
          iverilog -V | head -1
          make --version | head -1

      - name: Install iverilog + make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey is pre-installed on windows-latest. It places binaries
          # at C:\ProgramData\chocolatey\lib\<pkg>\tools\bin\ and creates shims
          # at C:\ProgramData\chocolatey\bin\ (already on PATH).
          # Note: choco can return exit 0 even on failure ("installed 0/0
          # packages" on a 408 from the feed), so we verify by Test-Path
          # rather than $LASTEXITCODE.

          $ivShim = 'C:\ProgramData\chocolatey\bin\iverilog.exe'
          $ok = $false

          # Try choco up to 3 times — the community feed occasionally 408s.
          for ($i = 1; $i -le 3; $i++) {
              Write-Host "choco install iverilog (attempt $i)..."
              choco install iverilog -y --no-progress
              if (Test-Path $ivShim) { $ok = $true; break }
              Write-Host "Attempt $i did not produce $ivShim; retrying in 10s..."
              Start-Sleep -Seconds 10
          }

          # Fallback: pinned direct download with a hard timeout so the job
          # cannot hang for 30+ minutes if the host is unreachable.
          if (-not $ok) {
              Write-Host "choco route exhausted; trying direct download (60s timeout)..."
              try {
                  $url = 'https://bleyer.org/icarus/iverilog-v12-20220611-x64_setup.exe'
                  $exe = "$env:RUNNER_TEMP\iverilog-setup.exe"
                  Invoke-WebRequest -Uri $url -OutFile $exe -TimeoutSec 60
                  Start-Process -FilePath $exe -ArgumentList '/S' -Wait
                  if (Test-Path 'C:\iverilog\bin\iverilog.exe') {
                      Add-Content -Path $env:GITHUB_PATH -Value 'C:\iverilog\bin'
                      $ivShim = 'C:\iverilog\bin\iverilog.exe'
                      $ok = $true
                  }
              } catch {
                  Write-Host "Direct download failed: $_"
              }
          }

          if (-not $ok) {
              Write-Error "Could not install iverilog via choco or fallback. Workflow needs maintenance."
              exit 1
          }

          # GNU make — also retry on transient feed errors.
          $mkShim = 'C:\ProgramData\chocolatey\bin\make.exe'
          $mkOk = $false
          for ($i = 1; $i -le 3; $i++) {
              Write-Host "choco install make (attempt $i)..."
              choco install make -y --no-progress
              if (Test-Path $mkShim) { $mkOk = $true; break }
              Start-Sleep -Seconds 10
          }
          if (-not $mkOk) {
              Write-Error "Could not install make via choco."
              exit 1
          }

          # Sanity check both binaries.
          & $ivShim -V | Select-Object -First 1
          & $mkShim --version | Select-Object -First 1

      - name: Show tool versions
        run: |
          iverilog -V | head -1 || true
          make --version | head -1

      - name: List discovered skills (informational)
        run: make list-skills

      - name: Full verify (skills with examples/ only)
        run: |
          # In Wave 0 there are no examples/ dirs yet, so `make verify`
          # iterates over an empty list and exits 0. Once Wave 1 lands the
          # first examples/ dir, this step becomes the regression gate
          # automatically — no workflow change needed.
          make verify
