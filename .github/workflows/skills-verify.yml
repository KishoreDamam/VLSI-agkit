name: skills-verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Force bash on both Linux and Windows so Makefile recipes use POSIX shell
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install iverilog (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog make
          iverilog -V | head -1
          make --version | head -1

      - name: Install iverilog + make (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey is pre-installed on windows-latest. It places binaries
          # at C:\ProgramData\chocolatey\lib\<pkg>\tools\bin\ and creates shims
          # at C:\ProgramData\chocolatey\bin\ (already on PATH).
          choco install iverilog -y --no-progress
          if ($LASTEXITCODE -ne 0) {
              Write-Error "choco install iverilog failed with exit code $LASTEXITCODE"
              exit 1
          }
          choco install make -y --no-progress
          if ($LASTEXITCODE -ne 0) {
              Write-Error "choco install make failed with exit code $LASTEXITCODE"
              exit 1
          }
          # Verify the shims resolve (refresh-env style — call the shim by
          # absolute path to bypass any PATH-cache issues in this step).
          & "C:\ProgramData\chocolatey\bin\iverilog.exe" -V | Select-Object -First 1
          & "C:\ProgramData\chocolatey\bin\make.exe" --version | Select-Object -First 1

      - name: Show tool versions
        run: |
          iverilog -V | head -1 || true
          make --version | head -1

      - name: Smoke test — fixture skill
        run: make fixture-verify

      - name: List discovered skills (informational)
        run: make list-skills

      - name: Full verify (skips skills without examples/)
        run: |
          # Wave 0 expects most skills to lack examples/. Once Wave 1/2
          # ship, this step is the gate that catches regressions.
          # We use `|| true` here ONLY in Wave 0 — remove this fallback
          # in the first Wave 1 PR that adds an examples/ dir.
          make verify || true
